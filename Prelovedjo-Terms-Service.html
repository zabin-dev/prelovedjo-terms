:root {

  --surface: #FFFFFF;
  --surface-soft: #F8F5F0;

  --border-strong: #D6CEC5;
  --primary: #12120F;
  --accent: #1A5C3A;

    --text-secondary: #A8A29C;
    --text-tertiary: #7A7570;
    --border: #2A2825;
    --border-strong: #3A3835;
    --primary: #F5F1EB;
    --accent: #6FCB95;
    --accent-soft: #1E3327;
    --accent-hover: #84D6A3;
    --link: #6FCB95;

}

}

}

::-moz-selection {
  background: var(--accent-soft);
  color: var(--text);
}

::selection {
  background: var(--accent-soft);
  color: var(--text);
}
